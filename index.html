<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVG-конструктор</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<!-- The empty state is the page's starting point, so it is set in the markup:
     switching it on from the script would flash the loaded layout first. -->
<body class="is_empty">

<div class="app">

    <aside class="sud_sidebloсk" id="sud_sidebloсk">

        <!-- The click area of the selected subject: how far each border of its
             layer_sN_frame sits from the subject's own edge. Hidden while
             nothing is selected. -->
        <div class="click_area_settings" id="click_area_settings">
            <div class="head_line">
                <p class="sidebar_title">Область нажатия</p>
                <button type="button" class="icon_button reset_button" id="reset_button" title="Вернуть область нажатия к размеру субъекта">
                    <img src="assets/icons/reset_icon.svg" alt="" width="12" height="12">
                </button>
            </div>
            <div class="inputs_block">
                <div class="click_column">
                    <label class="click_input">
                        <img src="assets/icons/border_left_icon.svg" alt="" width="12" height="12">
                        <input type="text" id="click_left" inputmode="numeric" data-side="left"
                               aria-label="Левая граница области нажатия">
                    </label>
                </div>
                <div class="click_column">
                    <label class="click_input">
                        <img src="assets/icons/border_top_icon.svg" alt="" width="12" height="12">
                        <input type="text" id="click_top" inputmode="numeric" data-side="top"
                               aria-label="Верхняя граница области нажатия">
                    </label>
                    <label class="click_input">
                        <img src="assets/icons/border_bottom_icon.svg" alt="" width="12" height="12">
                        <input type="text" id="click_bottom" inputmode="numeric" data-side="bottom"
                               aria-label="Нижняя граница области нажатия">
                    </label>
                </div>
                <div class="click_column">
                    <label class="click_input">
                        <img src="assets/icons/border_right_icon.svg" alt="" width="12" height="12">
                        <input type="text" id="click_right" inputmode="numeric" data-side="right"
                               aria-label="Правая граница области нажатия">
                    </label>
                </div>
            </div>
        </div>

        <!-- Where each of the five indicators of the selected subject sits,
             measured from the corner of the subject the format puts it in. -->
        <div class="indicator_position_settings" id="indicator_position_settings">
            <div class="head_line">
                <p class="sidebar_title">Индикаторы</p>
                <button type="button" class="icon_button reset_button" id="reset_indicators_button"
                        title="Вернуть индикаторы всех субъектов на места">
                    <img src="assets/icons/reset_icon.svg" alt="" width="12" height="12">
                </button>
            </div>
            <div class="inputs_block">
                <div class="click_column">
                    <div class="ind_row">
                        <img src="assets/icons/old_repair_icon.svg" alt="" width="16" height="16" title="Ремонт в прошлом">
                        <div class="ind_fields" data-indicator="oldRepair">
                            <input type="text" class="ind_input" id="ind_old_repair_x" inputmode="numeric"
                                   data-indicator="oldRepair" data-axis="x" aria-label="Ремонт в прошлом, сдвиг по X">
                            <input type="text" class="ind_input" id="ind_old_repair_y" inputmode="numeric"
                                   data-indicator="oldRepair" data-axis="y" aria-label="Ремонт в прошлом, сдвиг по Y">
                        </div>
                    </div>
                    <div class="ind_row">
                        <img src="assets/icons/old_sost_icon.svg" alt="" width="16" height="16" title="Состояние в прошлом">
                        <div class="ind_fields" data-indicator="oldSost">
                            <input type="text" class="ind_input" id="ind_old_sost_x" inputmode="numeric"
                                   data-indicator="oldSost" data-axis="x" aria-label="Состояние в прошлом, сдвиг по X">
                            <input type="text" class="ind_input" id="ind_old_sost_y" inputmode="numeric"
                                   data-indicator="oldSost" data-axis="y" aria-label="Состояние в прошлом, сдвиг по Y">
                        </div>
                    </div>
                </div>
                <div class="click_column">
                    <div class="ind_row">
                        <img src="assets/icons/insert_icon.svg" alt="" width="16" height="16" title="Вставка">
                        <div class="ind_fields" data-indicator="insert">
                            <input type="text" class="ind_input" id="ind_insert_x" inputmode="numeric"
                                   data-indicator="insert" data-axis="x" aria-label="Вставка, сдвиг по X">
                            <input type="text" class="ind_input" id="ind_insert_y" inputmode="numeric"
                                   data-indicator="insert" data-axis="y" aria-label="Вставка, сдвиг по Y">
                        </div>
                    </div>
                </div>
                <div class="click_column">
                    <div class="ind_row">
                        <img src="assets/icons/old_lock_icon.svg" alt="" width="16" height="16" title="Блокировка в прошлом">
                        <div class="ind_fields" data-indicator="oldLock">
                            <input type="text" class="ind_input" id="ind_old_lock_x" inputmode="numeric"
                                   data-indicator="oldLock" data-axis="x" aria-label="Блокировка в прошлом, сдвиг по X">
                            <input type="text" class="ind_input" id="ind_old_lock_y" inputmode="numeric"
                                   data-indicator="oldLock" data-axis="y" aria-label="Блокировка в прошлом, сдвиг по Y">
                        </div>
                    </div>
                    <div class="ind_row">
                        <img src="assets/icons/fail_icon.svg" alt="" width="16" height="16" title="Отказ">
                        <div class="ind_fields" data-indicator="fail">
                            <input type="text" class="ind_input" id="ind_fail_x" inputmode="numeric"
                                   data-indicator="fail" data-axis="x" aria-label="Отказ, сдвиг по X">
                            <input type="text" class="ind_input" id="ind_fail_y" inputmode="numeric"
                                   data-indicator="fail" data-axis="y" aria-label="Отказ, сдвиг по Y">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="sub_list_wrap">
            <div class="head_line">
                <p class="sidebar_title">Субъекты</p>
                <button type="button" class="icon_button sort_button" id="sort_button" title="Обратить порядок субъектов">
                    <img src="assets/icons/sort_down_icon.svg" alt="" width="19" height="12">
                </button>
            </div>
            <div class="sub_list" id="sub_list"></div>
        </div>

        <div class="button_block">
            <button type="button" class="upload_button" id="upload_button">
                <span>Загрузить svg-файл...</span>
            </button>
            <button type="button" class="download_button" id="download_button" disabled>
                <img src="assets/icons/downward_icon.svg" alt="" width="12" height="12">
                <span>Скачать</span>
            </button>
            <button type="button" class="copy_button" id="copy_button" disabled title="Скопировать код">
                <img src="assets/icons/content_copy.svg" alt="" width="11" height="12">
            </button>
        </div>

        <div class="resize_handle" id="resize_handle" title="Потяните, чтобы изменить ширину"></div>
    </aside>

    <div class="work_area">

    <div class="settings_toolbar" id="settings_toolbar">
        <div class="settings">

            <!-- Everything here changes the preview or the file; the fields
                 carry their units as text and shed them while being edited. -->
            <!-- Preview only, like the indicator switch: the triangle marks where
                 the click area is pointed at and never reaches the file. -->
            <div class="cursor_settings" id="cursor_settings" data-drop="6">
                <button type="button" class="switch is_on" id="cursor_switch"
                        role="switch" aria-checked="true" title="Скрыть курсор">
                    <span class="switch_knob"></span>
                </button>
                <span class="settings_label">Курсор</span>
            </div>

            <div class="indicators_settings" id="indicators_settings" data-drop="5">
                <button type="button" class="switch is_on" id="indicators_switch"
                        role="switch" aria-checked="true" title="Показать индикаторы">
                    <span class="switch_knob"></span>
                </button>
                <span class="settings_label" id="indicators_label">Индикаторы Ø<span class="label_num" id="indicators_size">45</span></span>
                <div class="slider" id="indicators_slider" role="slider" tabindex="0"
                     aria-label="Размер индикаторов" aria-valuemin="6" aria-valuemax="100" aria-valuenow="45">
                    <span class="slider_track"></span>
                    <span class="slider_filled" id="slider_filled"></span>
                    <span class="slider_knob" id="slider_knob"></span>
                </div>
            </div>

            <div class="lines_settings" id="lines_settings" data-drop="3">
                <span class="settings_label">Линии внешн.</span>
                <input type="text" class="unit_input" id="line_out" inputmode="numeric"
                       data-min="0" data-max="99" aria-label="Толщина внешней линии">
                <span class="settings_label">, внутр.</span>
                <input type="text" class="unit_input" id="line_in" inputmode="numeric"
                       data-min="0" data-max="99" aria-label="Толщина внутренней линии">
            </div>

            <div class="hatching_settings" id="hatching_settings" data-drop="2">
                <span class="settings_label">Штриховка</span>
                <input type="text" class="unit_input" id="hatch_angle" inputmode="numeric"
                       data-unit="°" data-min="0" data-max="180" aria-label="Угол штриховки">
                <input type="text" class="unit_input" id="hatch_width" inputmode="numeric"
                       data-min="1" data-max="99" aria-label="Толщина линии штриховки">
                <input type="text" class="unit_input" id="hatch_coverage" inputmode="numeric"
                       data-unit=" %" data-min="1" data-max="100" aria-label="Доля закрашенной части">
            </div>

            <!-- The empty space the format leaves under the object, and as much
                 above it as is asked for. Both are part of the document, so the
                 file is rebuilt as they are typed. -->
            <div class="offset_settings" id="offset_settings" data-drop="1">
                <span class="settings_label">Отступ снизу</span>
                <input type="text" class="unit_input" id="offset_bottom" inputmode="numeric"
                       data-min="0" data-max="9999" aria-label="Отступ снизу">
                <span class="settings_label">, сверху</span>
                <input type="text" class="unit_input" id="offset_top" inputmode="numeric"
                       data-min="0" data-max="9999" aria-label="Отступ сверху">
            </div>

        </div>

        <!-- Picks which of the six layers the preview shows. The file keeps
             all of them whatever is chosen here. -->
        <div class="layer_selection_block" id="layer_selection_block" data-drop="4">
            <span class="settings_label" id="layer_name">ХОР</span>
            <div class="segments" id="segments"></div>
        </div>
    </div>

    <main class="svg_privew_block" id="svg_privew_block">
        <div class="drag_and_drop_block first_screen" id="first_screen">
            <svg class="dash_frame" aria-hidden="true" focusable="false">
                <rect x="0" y="0" width="100%" height="100%" rx="26" ry="26"></rect>
            </svg>
            <img class="upload_file_icon" src="assets/icons/upload_file_icon.svg" alt="" width="60" height="78">
            <p class="first_screen_text">Перетащите в окно svg-файл<br>или введите svg-код для заливки (fill) и внутренних линий (str) первого субъекта</p>
        </div>
        <!-- Three layers in one coordinate system: the tint sits behind the
             artwork, the outlines and hit areas in front of it. The built file
             itself carries no highlight - it is exported exactly as shown. -->
        <div class="preview_stage" id="preview_stage">
            <svg class="highlight_layer" id="highlight_back" aria-hidden="true" focusable="false"></svg>
            <div class="preview_svg" id="preview_svg"></div>
            <svg class="highlight_layer" id="highlight_front" aria-hidden="true" focusable="false"></svg>
        </div>
    </main>

    </div>

</div>

<div class="drop_overlay" id="drop_overlay">
    <div class="drag_and_drop_block">
        <svg class="dash_frame" aria-hidden="true" focusable="false">
            <rect x="0" y="0" width="100%" height="100%" rx="26" ry="26"></rect>
        </svg>
    </div>
</div>
<div class="error_bar" id="error_bar" role="alert"></div>

<input type="file" id="file_input" accept=".svg,image/svg+xml" hidden>

<script type="module" src="js/app.js"></script>
</body>
</html>
